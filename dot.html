```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>ドット・インパクト - さんすうパーク</title>

    <style>
        /* ========================================
           基本設定
        ======================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #064e3b,
                #047857
            );

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;

            color: white;
            user-select: none;
            -webkit-user-select: none;
        }


        /* ========================================
           ゲーム本体
        ======================================== */

        .game-container {
            width: 100%;
            max-width: 420px;

            padding: 16px;

            background: #022c22;

            border: 6px solid #10b981;
            border-radius: 24px;

            box-shadow:
                0 10px 0 #047857,
                0 15px 25px rgba(0, 0, 0, 0.5);

            text-align: center;
        }


        /* タイトル */

        h1 {
            margin: 0 0 8px;

            color: #34d399;
            font-size: 22px;
        }


        /* ========================================
           情報バー
        ======================================== */

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 7px 12px;
            margin-bottom: 8px;

            background: #064e3b;

            border: 2px solid #059669;
            border-radius: 12px;

            color: #a7f3d0;
            font-size: 15px;
            font-weight: bold;
        }

        .number {
            color: #facc15;
            font-size: 18px;
        }

        .timer {
            color: #34d399;
            font-size: 18px;
        }


        /* ========================================
           コンボ表示
        ======================================== */

        .combo {
            min-height: 24px;
            margin-bottom: 5px;

            color: #facc15;

            font-size: 14px;
            font-weight: bold;

            text-shadow:
                0 0 8px #facc15;

            visibility: hidden;
        }

        .combo.show {
            visibility: visible;
            animation: comboPop 0.2s ease-out;
        }

        @keyframes comboPop {
            0% {
                transform: scale(0.5);
            }

            100% {
                transform: scale(1.1);
            }
        }


        /* ========================================
           ドット表示エリア
        ======================================== */

        .stage {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;

            height: 150px;
            margin-bottom: 14px;
        }

        .dot-card {
            display: grid;

            padding: 6px;

            background: #065f46;

            border: 3px solid #10b981;
            border-radius: 16px;

            box-shadow:
                inset 0 0 12px rgba(0, 0, 0, 0.4);

            overflow: hidden;
        }

        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .grid-4 {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ========================================
           ドット
        ======================================== */

        .dot {
            width: 24px;
            height: 24px;

            background:
                radial-gradient(
                    circle at 35% 35%,
                    #fffde7 0%,
                    #facc15 60%,
                    #ca8a04 100%
                );

            border-radius: 50%;

            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.4),
                0 0 10px rgba(250, 204, 21, 0.6);

            animation: dotPop 0.15s ease-out;
        }

        .dot.small {
            width: 18px;
            height: 18px;
        }

        @keyframes dotPop {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }


        /* ========================================
           答えボタン
        ======================================== */

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;

            margin-bottom: 12px;
        }

        .choice-button {
            padding: 14px 0;

            background: #059669;
            color: white;

            border: none;
            border-bottom: 5px solid #047857;
            border-radius: 14px;

            font-size: 26px;
            font-weight: bold;

            cursor: pointer;
            touch-action: manipulation;
        }

        .choice-button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .choice-button:disabled {
            opacity: 0.7;
        }


        /* ========================================
           共通ボタン
        ======================================== */

        .button {
            width: 100%;

            padding: 12px 0;

            border: none;
            border-radius: 14px;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .easy {
            background: #22c55e;
            border-bottom: 4px solid #15803d;
        }

        .medium {
            background: #3b82f6;
            border-bottom: 4px solid #1d4ed8;
        }

        .hard {
            background: #f43f5e;
            border-bottom: 4px solid #be123c;
        }

        .gray {
            background: #475569;
            border-bottom: 4px solid #334155;
        }


        /* ========================================
           オーバーレイ
        ======================================== */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.85);
        }

        .modal {
            width: 100%;
            max-width: 360px;

            padding: 20px;

            background: #064e3b;

            border: 5px solid #10b981;
            border-radius: 20px;

            text-align: center;
        }

        .modal h2 {
            margin-top: 0;
            color: #34d399;
        }

        .modal p {
            font-size: 14px;
            color: #a7f3d0;
        }

        .modal .button {
            margin-bottom: 8px;
        }


        /* ========================================
           非表示
        ======================================== */

        .hidden {
            display: none !important;
        }
    </style>
</head>


<body>

    <!-- ========================================
         ゲーム画面
    ======================================== -->

    <main class="game-container">

        <h1>🎯 ドット・インパクト</h1>

        <div class="info-bar">
            <span>
                のこり:
                <span id="questionNumber" class="number">10</span>
                問
            </span>

            <span>
                タイム:
                <span id="timer" class="timer">0.0</span>
                秒
            </span>
        </div>


        <div id="combo" class="combo">
            🔥 2 COMBO!
        </div>


        <!-- ドット表示 -->

        <div class="stage">

            <div
                id="leftCard"
                class="dot-card grid-3">
            </div>

            <div
                id="rightCard"
                class="dot-card grid-3">
            </div>

        </div>


        <!-- 答え -->

        <div
            id="choices"
            class="choices">
        </div>


        <!-- 難易度変更 -->

        <button
            id="changeLevelButton"
            class="button gray">
            🔄 むずかしさを えらびなおす
        </button>

    </main>


    <!-- ========================================
         コース選択
    ======================================== -->

    <div
        id="selectModal"
        class="overlay">

        <div class="modal">

            <h2>コースをえらぼう！</h2>

            <p>
                一瞬だけ光るボールの数を<br>
                あてよう！
            </p>


            <button
                class="button easy"
                data-level="easy">
                🟢 しょきゅう<br>
                （ごうけい 5まで）
            </button>


            <button
                class="button medium"
                data-level="medium">
                🔵 ちゅうきゅう<br>
                （ごうけい 10まで）
            </button>


            <button
                class="button hard"
                data-level="hard">
                🔴 じょうきゅう<br>
                （ごうけい 18まで）
            </button>


            <button
                class="button gray"
                id="menuButton">
                🏠 メニューにもどる
            </button>

        </div>
    </div>


    <!-- ========================================
         結果画面
    ======================================== -->

    <div
        id="resultModal"
        class="overlay hidden">

        <div class="modal">

            <h2>🎉 完全攻略！！</h2>

            <p>
                きろく:
                <strong
                    id="finalTime"
                    style="color:#34d399;">
                    0.0
                </strong>
                秒
            </p>

            <p
                id="maxCombo"
                style="color:#facc15;">
                さいこうコンボ: 0 回!
            </p>


            <button
                id="retryButton"
                class="button medium">
                もういちど あそぶ
            </button>


            <button
                id="otherCourseButton"
                class="button easy">
                ほかのコース
            </button>


            <button
                id="resultMenuButton"
                class="button gray">
                メニューにもどる
            </button>

        </div>
    </div>


    <script>
        /* ========================================
           ゲーム設定
        ======================================== */

        const QUESTIONS = 10;


        const LEVELS = {

            easy: {
                maxLeft: 3,
                maxRight: 2,
                showTime: 1200,
                gridSize: 3
            },

            medium: {
                maxLeft: 5,
                maxRight: 5,
                showTime: 900,
                gridSize: 3
            },

            hard: {
                maxLeft: 8,
                maxRight: 8,
                showTime: 600,
                gridSize: 4
            }

        };


        /* ========================================
           DOM取得
        ======================================== */

        const questionNumber =
            document.getElementById("questionNumber");

        const timer =
            document.getElementById("timer");

        const comboElement =
            document.getElementById("combo");

        const leftCard =
            document.getElementById("leftCard");

        const rightCard =
            document.getElementById("rightCard");

        const choicesElement =
            document.getElementById("choices");

        const selectModal =
            document.getElementById("selectModal");

        const resultModal =
            document.getElementById("resultModal");

        const finalTime =
            document.getElementById("finalTime");

        const maxComboElement =
            document.getElementById("maxCombo");


        /* ========================================
           ゲーム状態
        ======================================== */

        let currentLevel = "easy";

        let remainingQuestions = QUESTIONS;

        let correctAnswer = 0;

        let combo = 0;

        let maxCombo = 0;

        let startTime = 0;

        let timerId = null;

        let hideDotsId = null;

        let answering = false;


        /* ========================================
           音
        ======================================== */

        let audioContext = null;


        function playSound(type, pitch = 1) {

            try {

                if (!audioContext) {

                    audioContext =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();

                }


                if (audioContext.state === "suspended") {
                    audioContext.resume();
                }


                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();


                oscillator.connect(gain);

                gain.connect(
                    audioContext.destination
                );


                const now =
                    audioContext.currentTime;


                if (type === "correct") {

                    oscillator.frequency.setValueAtTime(
                        523 * pitch,
                        now
                    );

                    oscillator.frequency.exponentialRampToValueAtTime(
                        1046 * pitch,
                        now + 0.15
                    );

                    gain.gain.setValueAtTime(
                        0.2,
                        now
                    );

                    gain.gain.linearRampToValueAtTime(
                        0.01,
                        now + 0.15
                    );

                    oscillator.start(now);
                    oscillator.stop(now + 0.15);
                }


                if (type === "wrong") {

                    oscillator.type = "sawtooth";

                    oscillator.frequency.setValueAtTime(
                        140,
                        now
                    );

                    gain.gain.setValueAtTime(
                        0.3,
                        now
                    );

                    gain.gain.linearRampToValueAtTime(
                        0.01,
                        now + 0.2
                    );

                    oscillator.start(now);
                    oscillator.stop(now + 0.2);
                }


                if (type === "clear") {

                    oscillator.frequency.setValueAtTime(
                        523,
                        now
                    );

                    oscillator.frequency.setValueAtTime(
                        659,
                        now + 0.1
                    );

                    oscillator.frequency.setValueAtTime(
                        783,
                        now + 0.2
                    );

                    oscillator.frequency.setValueAtTime(
                        1046,
                        now + 0.3
                    );

                    gain.gain.setValueAtTime(
                        0.2,
                        now
                    );

                    gain.gain.linearRampToValueAtTime(
                        0.01,
                        now + 0.5
                    );

                    oscillator.start(now);
                    oscillator.stop(now + 0.5);
                }

            } catch (error) {

                console.log(
                    "音声を再生できませんでした。",
                    error
                );

            }
        }


        /* ========================================
           タイマー停止
        ======================================== */

        function stopTimer() {

            if (timerId !== null) {

                clearInterval(timerId);

                timerId = null;
            }

        }


        /* ========================================
           ゲーム開始
        ======================================== */

        function startGame() {

            stopTimer();


            if (hideDotsId !== null) {

                clearTimeout(hideDotsId);

                hideDotsId = null;
            }


            remainingQuestions = QUESTIONS;

            combo = 0;

            maxCombo = 0;

            answering = false;


            questionNumber.textContent =
                remainingQuestions;

            timer.textContent = "0.0";

            updateCombo();


            selectModal.classList.add("hidden");

            resultModal.classList.add("hidden");


            startTime = Date.now();


            timerId = setInterval(() => {

                const elapsed =
                    (Date.now() - startTime) / 1000;

                timer.textContent =
                    elapsed.toFixed(1);

            }, 100);


            nextQuestion();
        }


        /* ========================================
           次の問題
        ======================================== */

        function nextQuestion() {

            answering = false;


            if (hideDotsId !== null) {

                clearTimeout(hideDotsId);

                hideDotsId = null;
            }


            /* 10問終了 */

            if (remainingQuestions <= 0) {

                finishGame();

                return;
            }


            const setting =
                LEVELS[currentLevel];


            /* ドット数を決定 */

            const leftCount =
                randomNumber(
                    1,
                    setting.maxLeft
                );

            const rightCount =
                randomNumber(
                    1,
                    setting.maxRight
                );


            correctAnswer =
                leftCount + rightCount;


            /* ドット表示 */

            renderDots(
                leftCard,
                leftCount,
                setting.gridSize
            );


            renderDots(
                rightCard,
                rightCount,
                setting.gridSize
            );


            /* 答えボタン */

            createChoices(
                correctAnswer
            );


            /* 一定時間後にドットを消す */

            hideDotsId = setTimeout(() => {

                leftCard.innerHTML = "";

                rightCard.innerHTML = "";

            }, setting.showTime);

        }


        /* ========================================
           ドットを描画
        ======================================== */

        function renderDots(
            card,
            count,
            gridSize
        ) {

            card.innerHTML = "";

            card.className =
                "dot-card " +
                (gridSize === 4
                    ? "grid-4"
                    : "grid-3");


            const totalCells =
                gridSize * gridSize;


            const cells = [];


            for (
                let i = 0;
                i < totalCells;
                i++
            ) {

                const cell =
                    document.createElement("div");

                cell.className = "cell";

                card.appendChild(cell);

                cells.push(cell);
            }


            const selected =
                new Set();


            while (
                selected.size < count
            ) {

                selected.add(
                    Math.floor(
                        Math.random() *
                        totalCells
                    )
                );

            }


            selected.forEach(index => {

                const dot =
                    document.createElement("div");

                dot.className = "dot";


                if (gridSize === 4) {
                    dot.classList.add("small");
                }


                cells[index].appendChild(dot);

            });

        }


        /* ========================================
           答えを作る
        ======================================== */

        function createChoices(answer) {

            choicesElement.innerHTML = "";


            const choices =
                new Set();


            /* 正解 */

            choices.add(answer);


            /* ダミーを3個作る */

            while (
                choices.size < 4
            ) {

                let dummy =
                    answer +
                    randomNumber(-3, 3);


                if (dummy < 2) {
                    continue;
                }


                if (dummy > 18) {
                    continue;
                }


                choices.add(dummy);
            }


            /* シャッフル */

            const shuffled =
                [...choices].sort(
                    () => Math.random() - 0.5
                );


            shuffled.forEach(value => {

                const button =
                    document.createElement("button");

                button.className =
                    "choice-button";

                button.textContent =
                    value;


                button.addEventListener(
                    "click",
                    () => {

                        answerQuestion(
                            value,
                            button
                        );

                    }
                );


                choicesElement.appendChild(
                    button
                );

            });

        }


        /* ========================================
           回答
        ======================================== */

        function answerQuestion(
            value,
            clickedButton
        ) {

            /* 連打防止 */

            if (answering) {
                return;
            }


            /* 正解 */

            if (value === correctAnswer) {

                answering = true;


                combo++;

                if (combo > maxCombo) {
                    maxCombo = combo;
                }


                const pitch =
                    1 +
                    Math.min(
                        combo * 0.05,
                        0.5
                    );


                playSound(
                    "correct",
                    pitch
                );


                remainingQuestions--;


                questionNumber.textContent =
                    remainingQuestions;


                updateCombo();


                /* ボタンを一時的に無効化 */

                const buttons =
                    choicesElement.querySelectorAll(
                        "button"
                    );


                buttons.forEach(button => {
                    button.disabled = true;
                });


                /* 少し間をあける */

                setTimeout(() => {

                    nextQuestion();

                }, 180);

            }


            /* 不正解 */

            else {

                combo = 0;

                updateCombo();

                playSound("wrong");


                /* 押したボタンを少し揺らす */

                clickedButton.animate(
                    [
                        {
                            transform:
                                "translateX(-5px)"
                        },
                        {
                            transform:
                                "translateX(5px)"
                        },
                        {
                            transform:
                                "translateX(0)"
                        }
                    ],
                    {
                        duration: 180
                    }
                );

            }

        }


        /* ========================================
           コンボ表示
        ======================================== */

        function updateCombo() {

            if (combo >= 2) {

                comboElement.textContent =
                    `🔥 ${combo} COMBO!`;

                comboElement.classList.remove(
                    "show"
                );


                /* アニメーションを再実行 */

                void comboElement.offsetWidth;


                comboElement.classList.add(
                    "show"
                );

            }

            else {

                comboElement.classList.remove(
                    "show"
                );

            }

        }


        /* ========================================
           ゲーム終了
        ======================================== */

        function finishGame() {

            stopTimer();


            if (hideDotsId !== null) {

                clearTimeout(hideDotsId);

                hideDotsId = null;
            }


            leftCard.innerHTML = "";

            rightCard.innerHTML = "";

            choicesElement.innerHTML = "";


            const elapsed =
                (Date.now() - startTime) / 1000;


            finalTime.textContent =
                elapsed.toFixed(1);


            maxComboElement.textContent =
                `さいこうコンボ: ${maxCombo} 回!`;


            playSound("clear");


            resultModal.classList.remove(
                "hidden"
            );

        }


        /* ========================================
           難易度選択画面
        ======================================== */

        function showSelectModal() {

            stopTimer();


            if (hideDotsId !== null) {

                clearTimeout(hideDotsId);

                hideDotsId = null;
            }


            resultModal.classList.add(
                "hidden"
            );


            selectModal.classList.remove(
                "hidden"
            );

        }


        /* ========================================
           難易度変更
        ======================================== */

        document
            .querySelectorAll("[data-level]")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        currentLevel =
                            button.dataset.level;

                        startGame();

                    }
                );

            });


        /* ========================================
           ボタンイベント
        ======================================== */

        document
            .getElementById(
                "changeLevelButton"
            )
            .addEventListener(
                "click",
                showSelectModal
            );


        document
            .getElementById(
                "retryButton"
            )
            .addEventListener(
                "click",
                startGame
            );


        document
            .getElementById(
                "otherCourseButton"
            )
            .addEventListener(
                "click",
                showSelectModal
            );


        /* ========================================
           メニューボタン
        ======================================== */

        document
            .getElementById(
                "menuButton"
            )
            .addEventListener(
                "click",
                () => {

                    location.href =
                        "index.html";

                }
            );


        document
            .getElementById(
                "resultMenuButton"
            )
            .addEventListener(
                "click",
                () => {

                    location.href =
                        "index.html";

                }
            );


        /* ========================================
           乱数
        ======================================== */

        function randomNumber(
            min,
            max
        ) {

            return Math.floor(
                Math.random() *
                (max - min + 1)
            ) + min;

        }

    </script>

</body>
</html>
