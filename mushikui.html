<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>あなうめ たしざん - さんすうパーク</title>
    <link rel="stylesheet" href="css/game-common.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-container {
            background-color: white;
            border-radius: 24px;
            border: 6px solid #0284c7;
            box-shadow: 0 10px 0 #0369a1, 0 15px 25px rgba(0,0,0,0.15);
            padding: 20px 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: #0369a1;
            font-size: 22px;
            margin: 0 0 12px 0;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f0f9ff;
            border: 3px solid #7dd3fc;
            border-radius: 14px;
            padding: 8px 16px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 16px;
            color: #0369a1;
        }

        /* 数式表示エリア */
        .formula-card {
            background-color: #fff;
            border: 4px solid #38bdf8;
            border-radius: 20px;
            padding: 20px 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 36px;
            font-weight: bold;
            color: #1e293b;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
        }

        .hole-box {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 65px;
            height: 65px;
            background-color: #fef08a;
            border: 4px dashed #eab308;
            border-radius: 14px;
            color: #ca8a04;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 選択肢ボタン */
        .choices-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .choice-btn {
            background-color: #38bdf8;
            color: white;
            border: none;
            border-bottom: 5px solid #0284c7;
            border-radius: 16px;
            font-size: 28px;
            font-weight: bold;
            padding: 14px 0;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.05s;
        }

        .choice-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* 正解・不正解演出 */
        .choice-btn.correct {
            background-color: #4ade80 !important;
            border-bottom-color: #22c55e !important;
        }

        .choice-btn.wrong {
            background-color: #f87171 !important;
            border-bottom-color: #ef4444 !important;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* オーバーレイ（モーダル） */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 360px;
            width: 100%;
            border: 5px solid #0284c7;
            text-align: center;
        }

        .level-btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .btn-easy { background-color: #4ade80; border-bottom: 4px solid #22c55e; }
        .btn-mid  { background-color: #facc15; border-bottom: 4px solid #ca8a04; color: #713f12; }
        .btn-hard { background-color: #f87171; border-bottom: 4px solid #dc2626; }

        .back-btn {
            display: inline-block;
            width: 100%;
            padding: 10px 0;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background-color: #64748b;
            border: none;
            border-bottom: 4px solid #475569;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 6px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <h1 id="level-title">🧩 あなうめ たしざん</h1>
    
    <div class="info-bar">
        <span>もんだい: <span id="question-count" style="color:#0284c7; font-size:20px;">1</span> / 10</span>
        <span>タイム: <span id="timer-display" style="color:#e11d48; font-size:20px;">0.0</span> 秒</span>
    </div>

    <!-- 式表示 -->
    <div class="formula-card" id="formula-display">
        <!-- JSで生成 -->
    </div>

    <!-- 4択ボタン -->
    <div class="choices-grid" id="choices-container">
        <!-- JSで生成 -->
    </div>

    <button class="back-btn" onclick="showSelectModal()">🔄 むずかしさを えらびなおす</button>
</div>

<!-- 難易度選択画面 -->
<div id="select-modal" class="overlay">
    <div class="modal">
        <h2 style="color:#0369a1; margin-top:0; font-size:22px;">むずかしさを えらんでね！</h2>
        <p style="font-size:14px; color:#64748b; margin-bottom:16px;">□に はいる すうじを あてよう！</p>
        
        <button class="level-btn btn-easy" onclick="selectLevel('easy')">🟢 しょきゅう (ごうけい 10まで)</button>
        <button class="level-btn btn-mid"  onclick="selectLevel('mid')">🟡 ちゅうきゅう (ごうけい 15まで)</button>
        <button class="level-btn btn-hard" onclick="selectLevel('hard')">🔴 じょうきゅう (ごうけい 20まで)</button>

        <a href="index.html" class="back-btn">🏠 メニューにもどる</a>
    </div>
</div>

<!-- クリア画面 -->
<div id="result-modal" class="overlay hidden">
    <div class="modal">
        <h2 style="color:#22c55e; margin-top:0; font-size:26px;">🎉 せいかい！</h2>
        <p style="font-size:18px; color:#334155;">10もん かんりょう！<br>タイム: <b id="final-time" style="color:#0284c7; font-size:24px;"></b> 秒</p>
        <button class="level-btn btn-easy" onclick="startGame()">もういちど あそぶ</button>
        <button class="level-btn btn-mid" onclick="showSelectModal()">ほかの むずかしさ</button>
        <a href="index.html" class="back-btn">メニューにもどる</a>
    </div>
</div>

<script>
    // 効果音生成 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'ok') {
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'ng') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'clear') {
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    let currentLevel = 'easy'; // easy, mid, hard
    let maxTotal = 10;
    let qCount = 0;
    let correctAnswer = 0;
    let startTime = 0;
    let timerInterval = null;
    let isAnswering = false;

    function showSelectModal() {
        clearInterval(timerInterval);
        document.getElementById('result-modal').classList.add('hidden');
        document.getElementById('select-modal').classList.remove('hidden');
    }

    function selectLevel(level) {
        currentLevel = level;
        if (level === 'easy') {
            maxTotal = 10;
            document.getElementById('level-title').textContent = '🧩 あなうめ (しょきゅう)';
        } else if (level === 'mid') {
            maxTotal = 15;
            document.getElementById('level-title').textContent = '🧩 あなうめ (ちゅうきゅう)';
        } else {
            maxTotal = 20;
            document.getElementById('level-title').textContent = '🧩 あなうめ (じょうきゅう)';
        }
        document.getElementById('select-modal').classList.add('hidden');
        startGame();
    }

    function startGame() {
        document.getElementById('result-modal').classList.add('hidden');
        qCount = 0;
        startTime = Date.now();
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const diff = (Date.now() - startTime) / 1000;
            document.getElementById('timer-display').textContent = diff.toFixed(1);
        }, 100);

        nextQuestion();
    }

    function nextQuestion() {
        qCount++;
        if (qCount > 10) {
            // 全10問クリア
            clearInterval(timerInterval);
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(1);
            playSound('clear');
            document.getElementById('final-time').textContent = finalTime;
            document.getElementById('result-modal').classList.remove('hidden');
            return;
        }

        document.getElementById('question-count').textContent = qCount;
        isAnswering = true;

        // 問題生成
        // 目標の合計 (初級: 3〜10, 中級: 5〜15, 上級: 8〜20)
        const minTotal = currentLevel === 'easy' ? 3 : (currentLevel === 'mid' ? 5 : 8);
        const total = Math.floor(Math.random() * (maxTotal - minTotal + 1)) + minTotal;
        
        // 足す2つの数 (a + b = total)
        const a = Math.floor(Math.random() * (total - 1)) + 1; // 1 〜 total-1
        const b = total - a;

        // □の位置（0: 左が穴, 1: 右が穴）
        const holePos = Math.floor(Math.random() * 2);
        
        const formulaContainer = document.getElementById('formula-display');
        if (holePos === 0) {
            correctAnswer = a;
            formulaContainer.innerHTML = `<span class="hole-box">？</span> <span>＋</span> <span>${b}</span> <span>＝</span> <span>${total}</span>`;
        } else {
            correctAnswer = b;
            formulaContainer.innerHTML = `<span>${a}</span> <span>＋</span> <span class="hole-box">？</span> <span>＝</span> <span>${total}</span>`;
        }

        // 4択選択肢の作成
        const choices = [correctAnswer];
        while (choices.length < 4) {
            // 正解に近いダミー数字を作る
            let dummy = correctAnswer + (Math.floor(Math.random() * 5) - 2);
            if (dummy <= 0) dummy = correctAnswer + Math.floor(Math.random() * 3) + 1;
            if (dummy > maxTotal) dummy = maxTotal - Math.floor(Math.random() * 3);
            
            if (!choices.includes(dummy) && dummy > 0) {
                choices.push(dummy);
            }
        }

        // 選択肢をシャッフル
        for (let i = choices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [choices[i], choices[j]] = [choices[j], choices[i]];
        }

        // ボタン描画
        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = '';
        choices.forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = val;
            btn.onclick = () => checkAnswer(btn, val);
            choicesContainer.appendChild(btn);
        });
    }

    function checkAnswer(btn, val) {
        if (!isAnswering) return;

        if (val === correctAnswer) {
            // 正解
            isAnswering = false;
            playSound('ok');
            btn.classList.add('correct');
            setTimeout(() => {
                nextQuestion();
            }, 400);
        } else {
            // 不正解
            playSound('ng');
            btn.classList.add('wrong');
            setTimeout(() => {
                btn.classList.remove('wrong');
            }, 400);
        }
    }
</script>
</body>
</html>
