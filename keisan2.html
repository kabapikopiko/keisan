<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>わくわく！さんすう タイムアタック</title>
    <!-- 共通スタイルシート -->
    <link rel="stylesheet" href="css/game-common.css">
    <style>
        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .back-to-menu {
            color: #e67e22;
            border-color: #ffbe76;
            box-shadow: 0 4px 0 #f0932b;
        }

        #game-container {
            border: 6px solid #ffbe76; 
            box-shadow: 0 10px 0 #f0932b, 0 15px 30px rgba(0,0,0,0.15);
            width: 100%; max-width: 340px;
            height: 92vh; max-height: 580px; 
        }

        /* 演算切り替えタブ */
        .calc-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 5px;
        }
        .calc-tab-btn {
            background: #f1f2f6;
            border: 2px solid #ced6e0;
            border-radius: 12px;
            padding: 6px 0;
            font-size: 13px;
            font-weight: bold;
            color: #57606f;
            cursor: pointer;
            touch-action: manipulation;
        }
        .calc-tab-btn.active {
            background: #ff9f43;
            color: white;
            border-color: #e67e22;
        }

        /* レベル選択画面 */
        #level-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; gap: 12px;
        }
        #level-screen h2 {
            margin: 0 0 5px 0; color: #d35400; font-size: 22px;
        }

        .game-header h2 {
            margin: 0 0 4px 0; color: #d35400; font-size: 16px; text-shadow: 1px 1px 0 white;
        }

        .score-bar {
            display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;
            color: #2f3640; background: #f1f2f6; padding: 4px 10px; border-radius: 12px; margin-bottom: 4px;
        }
        .score-val { color: #e67e22; }
        .combo-val { color: #2ed573; }

        .dot.current { border: 2px solid #ff9f43; background-color: #fff; color: #ff9f43; transform: scale(1.05); }

        .question-zone {
            background-color: #f7f9fa; border: 4px dashed #c5eff7; border-radius: 20px;
            margin: 6px 0; flex-grow: 1; display: flex; justify-content: center; align-items: center; min-height: 75px;
        }

        #question-row { display: flex; justify-content: center; align-items: center; gap: 8px; }
        #question { font-size: 38px; font-weight: bold; color: #2c3e50; text-shadow: 1px 1px 0px #fff; }

        #answer-display {
            font-size: 38px; font-weight: bold; width: 80px; height: 55px; line-height: 50px;
            border-bottom: 5px solid #ff9f43; color: #ff9f43; text-align: center; background-color: #fff; border-radius: 8px 8px 0 0;
        }

        .score-result {
            font-size: 28px; color: #2ed573; font-weight: bold; margin-bottom: 15px;
        }
    </style>
</head>
<body>

<a href="index.html" id="back-btn" class="back-to-menu" onclick="playSound('click')">🏠 メニュー</a>

<div class="wrapper">
    <div id="game-container">
        <div id="flash-overlay">
            <div id="flash-mark">💮</div>
            <div id="flash-text">せいかい！</div>
        </div>

        <!-- レベル・モード選択画面 -->
        <div id="level-screen">
            <h2>どの計算にする？</h2>
            <div class="calc-tabs">
                <button class="calc-tab-btn active" id="tab-add" onclick="setOpMode('+')">＋ たす</button>
                <button class="calc-tab-btn" id="tab-sub" onclick="setOpMode('-')">－ ひく</button>
                <button class="calc-tab-btn" id="tab-mul" onclick="setOpMode('×')">× かける</button>
                <button class="calc-tab-btn" id="tab-div" onclick="setOpMode('÷')">÷ わる</button>
            </div>

            <h2>むずかしさは？</h2>
            <button class="btn-level btn-easy" onclick="selectLevel('easy')">🟢 しょきゅう</button>
            <button class="btn-level btn-medium" onclick="selectLevel('medium')">🟡 ちゅうきゅう</button>
            <button class="btn-level btn-hard" onclick="selectLevel('hard')">🔴 じょうきゅう</button>
        </div>

        <!-- プレイ画面 -->
        <div id="play-screen" style="height: 100%; display: none; flex-direction: column; justify-content: space-between;">
            <div class="game-header">
                <h2>⏱️ <span id="op-title">けいさん</span> [<span id="mode-title"></span>]</h2>
                <div class="score-bar">
                    <span>スコア: <span id="current-score" class="score-val">0</span></span>
                    <span>れんぞく: <span id="current-combo" class="combo-val">0</span></span>
                </div>
                <div id="history-board">
                    <div class="dot" id="dot-0">1</div>
                    <div class="dot" id="dot-1">2</div>
                    <div class="dot" id="dot-2">3</div>
                    <div class="dot" id="dot-3">4</div>
                    <div class="dot" id="dot-4">5</div>
                    <div class="dot" id="dot-5">6</div>
                    <div class="dot" id="dot-6">7</div>
                    <div class="dot" id="dot-7">8</div>
                    <div class="dot" id="dot-8">9</div>
                    <div class="dot" id="dot-9">10</div>
                </div>
            </div>
            
            <div class="question-zone">
                <div id="question-row">
                    <div id="question">? + ? =</div>
                    <div id="answer-display"></div>
                </div>
            </div>

            <div class="keyboard">
                <button class="key key-num" onclick="pressKey('1')">1</button>
                <button class="key key-num" onclick="pressKey('2')">2</button>
                <button class="key key-num" onclick="pressKey('3')">3</button>
                <button class="key key-num" onclick="pressKey('4')">4</button>
                <button class="key key-num" onclick="pressKey('5')">5</button>
                <button class="key key-num" onclick="pressKey('6')">6</button>
                <button class="key key-num" onclick="pressKey('7')">7</button>
                <button class="key key-num" onclick="pressKey('8')">8</button>
                <button class="key key-num" onclick="pressKey('9')">9</button>
                <button class="key key-num" onclick="pressKey('0')">0</button>
                <button class="key key-clear" onclick="pressKey('clear')">けす</button>
                <button class="key key-enter" onclick="pressKey('enter')">こたえる</button>
            </div>
        </div>

        <!-- リザルト画面 -->
        <div id="result-screen">
            <h2>🎉 チャレンジ終了！</h2>
            <div class="time-label">かかった時間</div>
            <div class="time-text" id="final-time">00秒00</div>
            <div class="time-label">かくとくスコア</div>
            <div class="score-result" id="final-score-val">0 点</div>
            <p id="final-score" style="font-size: 16px; font-weight: bold; color: #57606f; margin-bottom: 15px;"></p>
            <button class="btn-restart" onclick="showLevelSelect()">もういちどチャレンジ</button>
        </div>
    </div>
</div>

<script>
    let opMode = "+"; // +, -, ×, ÷
    let currentLevel = "medium"; 
    let num1 = 0, num2 = 0, correctAnswer = 0;
    let currentQuestionIndex = 0;
    let correctCount = 0;
    let currentInput = "";
    let startTime = 0;
    let questionStartTime = 0;
    let lockInput = false;
    let totalScore = 0;
    let comboCount = 0;

    const totalQuestions = 10;

    const backBtn = document.getElementById('back-btn');
    const levelScreen = document.getElementById('level-screen');
    const playScreen = document.getElementById('play-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionEl = document.getElementById('question');
    const answerDisplayEl = document.getElementById('answer-display');
    const flashOverlay = document.getElementById('flash-overlay');
    const flashMark = document.getElementById('flash-mark');
    const flashText = document.getElementById('flash-text');
    const finalTimeEl = document.getElementById('final-time');
    const finalScoreEl = document.getElementById('final-score');
    const finalScoreValEl = document.getElementById('final-score-val');
    const modeTitleEl = document.getElementById('mode-title');
    const opTitleEl = document.getElementById('op-title');
    const currentScoreEl = document.getElementById('current-score');
    const currentComboEl = document.getElementById('current-combo');

    // 効果音 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'correct') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.08);
            gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'incorrect') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.linearRampToValueAtTime(120, now + 0.25);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now); osc.stop(now + 0.25);
        }
    }

    // キラキラ演出
    function createParticles() {
        const colors = ['#ff4757', '#ffca28', '#2ed573', '#1e90ff', '#e056fd'];
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 8 + 4;
            p.style.width = `${size}px`; p.style.height = `${size}px`;
            p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = '50%'; p.style.top = '40%';
            document.body.appendChild(p);
            
            const angle = Math.random() * Math.PI * 2;
            const v = Math.random() * 140 + 70;
            const dx = Math.cos(angle) * v; const dy = Math.sin(angle) * v - 20;
            
            const anim = p.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
            ], { duration: 500, easing: 'cubic-bezier(0.1, 0.8, 0.25, 1)', fill: 'forwards' });
            anim.onfinish = () => p.remove();
        }
    }

    // 四則演算切り替え
    function setOpMode(op) {
        playSound('click');
        opMode = op;
        const map = { '+': 'tab-add', '-': 'tab-sub', '×': 'tab-mul', '÷': 'tab-div' };
        document.querySelectorAll('.calc-tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(map[op]).classList.add('active');
    }

    function showLevelSelect() {
        resultScreen.style.display = 'none';
        levelScreen.style.display = 'flex';
        backBtn.classList.remove('hidden');
    }

    function selectLevel(level) {
        playSound('click');
        currentLevel = level;
        
        if (level === 'easy') modeTitleEl.innerText = "しょきゅう";
        if (level === 'medium') modeTitleEl.innerText = "ちゅうきゅう";
        if (level === 'hard') modeTitleEl.innerText = "じょうきゅう";

        const opMap = { '+': 'たしざん', '-': 'ひきざん', '×': 'かけざん', '÷': 'わりざん' };
        opTitleEl.innerText = opMap[opMode];

        initGame();
    }

    function initGame() {
        currentQuestionIndex = 0;
        correctCount = 0;
        totalScore = 0;
        comboCount = 0;
        currentInput = "";
        lockInput = false;

        currentScoreEl.innerText = totalScore;
        currentComboEl.innerText = comboCount;

        for (let i = 0; i < totalQuestions; i++) {
            const dot = document.getElementById(`dot-${i}`);
            dot.className = "dot";
            dot.innerText = i + 1;
        }

        levelScreen.style.display = 'none';
        playScreen.style.display = 'flex';
        resultScreen.style.display = 'none';
        flashOverlay.classList.remove('active');
        backBtn.classList.add('hidden');

        startTime = performance.now();
        makeQuestion();
    }

    function makeQuestion() {
        questionStartTime = performance.now();

        if (opMode === '+') {
            if (currentLevel === 'easy') { num1 = rand(1, 5); num2 = rand(1, 5); }
            else if (currentLevel === 'hard') { num1 = rand(11, 19); num2 = rand(1, 9); }
            else { num1 = rand(1, 9); num2 = rand(1, 9); }
            correctAnswer = num1 + num2;
        } else if (opMode === '-') {
            if (currentLevel === 'easy') { num1 = rand(2, 9); num2 = rand(1, num1); }
            else if (currentLevel === 'hard') { num1 = rand(15, 30); num2 = rand(1, 14); }
            else { num1 = rand(5, 15); num2 = rand(1, num1); }
            correctAnswer = num1 - num2;
        } else if (opMode === '×') {
            if (currentLevel === 'easy') { num1 = rand(1, 5); num2 = rand(1, 5); }
            else if (currentLevel === 'hard') { num1 = rand(6, 12); num2 = rand(1, 9); }
            else { num1 = rand(1, 9); num2 = rand(1, 9); }
            correctAnswer = num1 * num2;
        } else if (opMode === '÷') {
            if (currentLevel === 'easy') { num2 = rand(1, 5); correctAnswer = rand(1, 5); }
            else if (currentLevel === 'hard') { num2 = rand(2, 12); correctAnswer = rand(2, 9); }
            else { num2 = rand(1, 9); correctAnswer = rand(1, 9); }
            num1 = num2 * correctAnswer;
        }

        questionEl.innerText = `${num1} ${opMode} ${num2} ＝`;
        currentInput = "";
        answerDisplayEl.innerText = "";

        document.getElementById(`dot-${currentQuestionIndex}`).classList.add('current');
    }

    function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pressKey(key) {
        if (lockInput) return;
        playSound('click');

        if (key === 'clear') {
            currentInput = "";
        } else if (key === 'enter') {
            checkAnswer();
            return;
        } else {
            if (currentInput.length < 3) {
                currentInput += key;
            }
        }
        answerDisplayEl.innerText = currentInput;
    }

    function checkAnswer() {
        const userAnswer = parseInt(currentInput);
        if (isNaN(userAnswer)) return;

        lockInput = true;
        const currentDot = document.getElementById(`dot-${currentQuestionIndex}`);
        currentDot.classList.remove('current');

        const isCorrect = (userAnswer === correctAnswer);
        const timeTaken = (performance.now() - questionStartTime) / 1000;

        if (isCorrect) {
            playSound('correct');
            createParticles();
            currentDot.className = "dot o";
            currentDot.innerText = "◯";
            
            // スコア計算：基本100点 + タイムボーナス(最大100点) + コンボボーナス
            comboCount++;
            correctCount++;
            const timeBonus = Math.max(0, Math.floor((5 - timeTaken) * 20));
            const addedScore = 100 + timeBonus + (comboCount * 20);
            totalScore += addedScore;

            flashMark.innerText = "💮";
            flashText.innerText = `せいかい！ +${addedScore}pt`;
            flashText.style.color = "#2ed573";
        } else {
            playSound('incorrect');
            currentDot.className = "dot x";
            currentDot.innerText = "×";
            comboCount = 0;
            
            flashMark.innerText = "❌";
            flashText.innerText = `こたえは 【${correctAnswer}】`;
            flashText.style.color = "#ff4757";
        }

        currentScoreEl.innerText = totalScore;
        currentComboEl.innerText = comboCount;
        flashOverlay.classList.add('active');

        setTimeout(() => {
            flashOverlay.classList.remove('active');
            currentQuestionIndex++;

            if (currentQuestionIndex < totalQuestions) {
                lockInput = false;
                makeQuestion();
            } else {
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        const endTime = performance.now();
        const totalTime = ((endTime - startTime) / 1000).toFixed(2);

        playScreen.style.display = 'none';
        resultScreen.style.display = 'flex';

        finalTimeEl.innerText = `${totalTime} 秒`;
        finalScoreValEl.innerText = `${totalScore} 点`;
        finalScoreEl.innerText = `${totalQuestions}もん中 ${correctCount}もん せいかい！`;
    }
</script>

</body>
</html>
