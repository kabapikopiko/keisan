<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ナンバー・チェイン (Number Chain)</title>
    <!-- 共通スタイルシート -->
    <link rel="stylesheet" href="css/game-common.css">
    <style>
        body {
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
        }

        .back-to-menu {
            color: #1e90ff;
            border-color: #70a1ff;
            box-shadow: 0 4px 0 #1e90ff;
        }

        #game-container {
            border: 6px solid #70a1ff; 
            box-shadow: 0 10px 0 #1e90ff, 0 15px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 360px;
            height: 94vh;
            max-height: 620px; 
        }

        /* ヘッダー */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f2f6;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: #2f3640;
            font-size: 16px;
        }

        /* 目標・現在合計エリア */
        .target-zone {
            background: #f8a5c2;
            border: 4px solid #f5cd79;
            border-radius: 25px;
            padding: 10px;
            margin: 8px 0;
            color: white;
            box-shadow: 0 4px 0 #e67e22;
        }

        .target-label {
            font-size: 14px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }

        .target-number {
            font-size: 42px;
            font-weight: bold;
            line-height: 1;
            margin: 4px 0;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .current-sum-box {
            font-size: 18px;
            font-weight: bold;
            color: #2f3640;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 4px 10px;
            display: inline-block;
            margin-top: 2px;
        }

        /* パズル盤面 */
        #grid-container {
            position: relative;
            width: 100%;
            height: 310px;
            background: #f7f9fa;
            border: 4px dashed #70a1ff;
            border-radius: 25px;
            margin: 5px 0;
            touch-action: none;
        }

        /* キャンバス（ライン描画用） */
        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 数字バブル */
        .bubble {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid #54a0ff;
            color: #2f3640;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #2e86de;
            z-index: 2;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease, background-color 0.1s ease;
            cursor: pointer;
        }

        .bubble.selected {
            background: #ff4757;
            border-color: #ff6b81;
            color: white;
            box-shadow: 0 2px 0 #ed4245;
            transform: translate(-50%, -50%) scale(1.15);
            z-index: 3;
        }

        /* 画面切替 */
        #start-screen, #result-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 29px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn-main {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            border-bottom: 6px solid #26af5f;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(46, 213, 115, 0.4);
            touch-action: manipulation;
            margin-top: 15px;
        }
        .btn-main:active {
            transform: translateY(3px);
            border-bottom: 3px solid #26af5f;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            z-index: 999;
        }
    </style>
</head>
<body>

<a href="index.html" class="back-to-menu">🏠 メニュー</a>

<div class="wrapper">
    <div id="game-container">

        <!-- スタート画面 -->
        <div id="start-screen">
            <h1 style="color: #3f2b96; margin-bottom: 10px; font-size: 26px;">🔗 ナンバー・チェイン</h1>
            <p style="color: #57606f; font-size: 15px; line-height: 1.6; text-align: left; background: #f1f2f6; padding: 15px; border-radius: 15px;">
                <b>【あそびかた】</b><br>
                ・数字を<b>指やマウスでなぞってつなぐ</b>！<br>
                ・合計が<b>「もくひょう」</b>にぴったりで消える！<br>
                ・制限時間内にたくさんの数を作ろう！
            </p>
            <button class="btn-main" onclick="startGame()">スタート！</button>
        </div>

        <!-- プレイヘッダー -->
        <div class="game-header">
            <div>⏱️ <span id="timer-display">60</span>秒</div>
            <div>🏆 スコア: <span id="score-display">0</span></div>
        </div>

        <!-- 目標設定表示 -->
        <div class="target-zone">
            <div class="target-label">なぞって この数をつくれ！</div>
            <div class="target-number" id="target-display">15</div>
            <div class="current-sum-box">いまの合計: <span id="current-sum">0</span></div>
        </div>

        <!-- パズル盤面 -->
        <div id="grid-container">
            <canvas id="line-canvas"></canvas>
            <!-- バブルはJavaScriptで生成 -->
        </div>

        <!-- リザルト画面 -->
        <div id="result-screen" style="display: none;">
            <h2 style="color: #3f2b96; font-size: 28px; margin-bottom: 5px;">🎉 タイムアップ！</h2>
            <p style="font-size: 18px; color: #7f8c8d; margin-bottom: 5px;">最終スコア</p>
            <div style="font-size: 48px; font-weight: bold; color: #e67e22; margin-bottom: 15px;" id="final-score">0</div>
            <p style="font-size: 15px; color: #2ed573; font-weight: bold; margin-bottom: 15px;" id="high-score-msg"></p>
            <button class="btn-main" onclick="startGame()">もういちど遊ぶ</button>
        </div>

    </div>
</div>

<script>
    const ROWS = 5;
    const COLS = 5;
    const GAME_TIME = 60;

    let grid = []; // バブルのオブジェクト保持
    let selectedChain = []; // 現在なぞっているバブルの配列
    let targetNumber = 15;
    let currentSum = 0;
    let score = 0;
    let timeLeft = GAME_TIME;
    let timerInterval = null;
    let isDragging = false;

    const gridContainer = document.getElementById('grid-container');
    const canvas = document.getElementById('line-canvas');
    const ctx = canvas.getContext('2d');
    const targetDisplay = document.getElementById('target-display');
    const currentSumDisplay = document.getElementById('current-sum');
    const scoreDisplay = document.getElementById('score-display');
    const timerDisplay = document.getElementById('timer-display');
    const startScreen = document.getElementById('start-screen');
    const resultScreen = document.getElementById('result-screen');
    const finalScoreDisplay = document.getElementById('final-score');
    const highScoreMsg = document.getElementById('high-score-msg');

    // 効果音 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'select') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300 + selectedChain.length * 50, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'clear') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08);
            osc.frequency.setValueAtTime(783.99, now + 0.16);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.start(now); osc.stop(now + 0.35);
        }
    }

    // キャンバス解像度調整
    function resizeCanvas() {
        canvas.width = gridContainer.clientWidth;
        canvas.height = gridContainer.clientHeight;
    }

    function startGame() {
        score = 0;
        timeLeft = GAME_TIME;
        scoreDisplay.innerText = score;
        timerDisplay.innerText = timeLeft;

        startScreen.style.display = 'none';
        resultScreen.style.display = 'none';

        resizeCanvas();
        initGrid();
        generateNewTarget();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    // 新しい目標数の生成（10〜25）
    function generateNewTarget() {
        targetNumber = Math.floor(Math.random() * 16) + 10;
        targetDisplay.innerText = targetNumber;
    }

    // 盤面の初期化＆バブル生成
    function initGrid() {
        gridContainer.querySelectorAll('.bubble').forEach(b => b.remove());
        grid = [];

        const width = gridContainer.clientWidth;
        const height = gridContainer.clientHeight;
        const colStep = width / COLS;
        const rowStep = height / ROWS;

        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                const val = Math.floor(Math.random() * 9) + 1; // 1〜9の数字
                const x = colStep * c + colStep / 2;
                const y = rowStep * r + rowStep / 2;

                const el = document.createElement('div');
                el.className = 'bubble';
                el.innerText = val;
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;

                const bubbleObj = { r, c, val, x, y, el };
                grid[r][c] = bubbleObj;

                gridContainer.appendChild(el);
            }
        }
    }

    // タッチ＆マウスのイベント登録
    gridContainer.addEventListener('pointerdown', handlePointerDown);
    gridContainer.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerUp);

    function handlePointerDown(e) {
        const bubble = getBubbleFromPoint(e.clientX, e.clientY);
        if (bubble) {
            isDragging = true;
            addToChain(bubble);
        }
    }

    function handlePointerMove(e) {
        if (!isDragging) return;
        const bubble = getBubbleFromPoint(e.clientX, e.clientY);
        if (bubble) {
            // 直前のバブルに戻った場合は最後の1つを解除（キャンセル操作）
            if (selectedChain.length > 1 && selectedChain[selectedChain.length - 2] === bubble) {
                popFromChain();
                return;
            }

            // 隣接していて、まだ選択されていないバブルなら追加
            if (!selectedChain.includes(bubble) && isAdjacent(selectedChain[selectedChain.length - 1], bubble)) {
                addToChain(bubble);
            }
        }
    }

    function handlePointerUp() {
        if (!isDragging) return;
        isDragging = false;

        // 合計判定
        if (currentSum === targetNumber) {
            // 🎉 大正解！消去処理
            playSound('clear');
            createParticles(selectedChain[selectedChain.length - 1]);
            score += selectedChain.length * 10;
            scoreDisplay.innerText = score;

            // バブルの置き換え
            selectedChain.forEach(b => {
                b.val = Math.floor(Math.random() * 9) + 1;
                b.el.innerText = b.val;
            });

            generateNewTarget();
        }

        resetChain();
    }

    // 2つのバブルが隣り合っているか判定（斜めもOK）
    function isAdjacent(b1, b2) {
        const dr = Math.abs(b1.r - b2.r);
        const dc = Math.abs(b1.c - b2.c);
        return dr <= 1 && dc <= 1;
    }

    function addToChain(bubble) {
        selectedChain.push(bubble);
        bubble.el.classList.add('selected');
        currentSum += bubble.val;
        currentSumDisplay.innerText = currentSum;
        playSound('select');
        drawLines();

        // 合計が目標を超えたら警告演出
        if (currentSum > targetNumber) {
            currentSumDisplay.style.color = '#ff4757';
        } else if (currentSum === targetNumber) {
            currentSumDisplay.style.color = '#2ed573';
        } else {
            currentSumDisplay.style.color = '#2f3640';
        }
    }

    function popFromChain() {
        const popped = selectedChain.pop();
        popped.el.classList.remove('selected');
        currentSum -= popped.val;
        currentSumDisplay.innerText = currentSum;
        drawLines();
    }

    function resetChain() {
        selectedChain.forEach(b => b.el.classList.remove('selected'));
        selectedChain = [];
        currentSum = 0;
        currentSumDisplay.innerText = 0;
        currentSumDisplay.style.color = '#2f3640';
        clearLines();
    }

    // ライン描画
    function drawLines() {
        clearLines();
        if (selectedChain.length < 2) return;

        ctx.beginPath();
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#ff4757';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.moveTo(selectedChain[0].x, selectedChain[0].y);
        for (let i = 1; i < selectedChain.length; i++) {
            ctx.lineTo(selectedChain[i].x, selectedChain[i].y);
        }
        ctx.stroke();
    }

    function clearLines() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // 座標からバブルを取得
    function getBubbleFromPoint(x, y) {
        const rect = gridContainer.getBoundingClientRect();
        const relX = x - rect.left;
        const relY = y - rect.top;

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const b = grid[r][c];
                const dist = Math.hypot(b.x - relX, b.y - relY);
                if (dist < 28) return b; // 円の判定半径
            }
        }
        return null;
    }

    // 演出用パーティクル
    function createParticles(targetBubble) {
        const colors = ['#ff4757', '#ffca28', '#2ed573', '#1e90ff', '#e056fd'];
        const rect = gridContainer.getBoundingClientRect();
        const startX = rect.left + targetBubble.x;
        const startY = rect.top + targetBubble.y;

        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 8 + 6;
            p.style.width = `${size}px`; p.style.height = `${size}px`;
            p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = `${startX}px`; p.style.top = `${startY}px`;
            document.body.appendChild(p);

            const angle = Math.random() * Math.PI * 2;
            const v = Math.random() * 120 + 60;
            const dx = Math.cos(angle) * v;
            const dy = Math.sin(angle) * v;

            const anim = p.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
            ], { duration: 500, easing: 'ease-out', fill: 'forwards' });
            anim.onfinish = () => p.remove();
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        resetChain();

        const highScore = localStorage.getItem('number_chain_high') || 0;
        let isNewHigh = false;

        if (score > highScore) {
            localStorage.setItem('number_chain_high', score);
            isNewHigh = true;
        }

        finalScoreDisplay.innerText = `${score} 点`;
        highScoreMsg.innerText = isNewHigh ? '🏆 ハイスコアこうしん！' : `(自己ベスト: ${highScore}点)`;

        resultScreen.style.display = 'flex';
    }

    window.addEventListener('resize', resizeCanvas);
</script>

</body>
</html>
