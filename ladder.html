<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>さんすうラダー - さんすうパーク</title>
    <link rel="stylesheet" href="css/game-common.css">
    <style>
        body {
            background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box;
            font-family: sans-serif; user-select: none;
        }
        .game-container {
            background-color: white; border-radius: 24px; border: 6px solid #f59e0b;
            box-shadow: 0 10px 0 #b45309, 0 15px 25px rgba(0,0,0,0.15);
            padding: 16px; width: 100%; max-width: 420px; text-align: center; box-sizing: border-box;
        }
        h1 { color: #b45309; font-size: 22px; margin: 0 0 8px 0; }
        .info-bar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #fffbebfb; border: 3px solid #fde68a; border-radius: 14px;
            padding: 8px 14px; margin-bottom: 12px; font-weight: bold; font-size: 16px; color: #b45309;
        }
        .rule-hint { font-size: 14px; font-weight: bold; color: #78350f; margin-bottom: 8px; }
        .target-box {
            font-size: 42px; font-weight: bold; color: #b45309; background: #fffbebfb;
            border: 4px solid #f59e0b; border-radius: 16px; padding: 12px; margin-bottom: 16px;
        }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .step-btn {
            background: #f59e0b; color: white; border: none; border-bottom: 5px solid #b45309;
            border-radius: 16px; font-size: 22px; font-weight: bold; padding: 20px 0; cursor: pointer;
        }
        .step-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px;
        }
        .modal {
            background: white; border-radius: 20px; padding: 20px; max-width: 360px; width: 100%;
            border: 5px solid #f59e0b; text-align: center;
        }
        .start-btn, .back-btn {
            display: inline-block; width: 100%; padding: 12px 0; font-size: 16px; font-weight: bold;
            color: white; background-color: #f59e0b; border: none; border-bottom: 5px solid #b45309;
            border-radius: 14px; cursor: pointer; text-decoration: none; margin-top: 8px; box-sizing: border-box;
        }
        .back-btn { background-color: #64748b; border-bottom-color: #475569; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🏃‍♂️ さんすうラダー</h1>
    <div class="info-bar">
        <span>のこり: <span id="rem-count">10</span> ステップ</span>
        <span>タイム: <span id="timer">0.0</span> 秒</span>
    </div>

    <div class="rule-hint">ぐうすう ➔ [イン] / きすう ➔ [アウト]</div>
    <div class="target-box" id="target-num">0</div>

    <div class="btn-grid">
        <button class="step-btn" onclick="step('in')">📥 イン (ぐうすう)</button>
        <button class="step-btn" onclick="step('out')">📤 アウト (きすう)</button>
    </div>

    <a href="index.html" class="back-btn" style="padding:8px 0; font-size:14px;">🏠 メニューにもどる</a>
</div>

<div id="result-modal" class="overlay hidden">
    <div class="modal">
        <h2 style="color:#f59e0b; margin-top:0;">🎉 ゴール！！</h2>
        <p style="font-size:18px;">タイム: <b id="final-time" style="color:#f59e0b;"></b> 秒</p>
        <button class="start-btn" onclick="startGame()">もういちど あそぶ</button>
        <a href="index.html" class="back-btn">メニューにもどる</a>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'step') {
            osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'ng') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'clear') {
            osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1);
            osc.frequency.setValueAtTime(783, now + 0.2); osc.frequency.setValueAtTime(1046, now + 0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        }
    }

    let remaining = 10, currentNum = 0, startTime = 0, timerInterval = null;

    function startGame() {
        remaining = 10; startTime = Date.now();
        document.getElementById('result-modal').classList.add('hidden');
        document.getElementById('rem-count').textContent = remaining;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            document.getElementById('timer').textContent = ((Date.now() - startTime) / 1000).toFixed(1);
        }, 100);
        nextStep();
    }

    function nextStep() {
        currentNum = Math.floor(Math.random() * 20) + 1;
        document.getElementById('target-num').textContent = currentNum;
    }

    function step(type) {
        const isEven = currentNum % 2 === 0;
        const correct = (isEven && type === 'in') || (!isEven && type === 'out');

        if (correct) {
            playSound('step');
            remaining--;
            document.getElementById('rem-count').textContent = remaining;
            if (remaining === 0) {
                clearInterval(timerInterval); playSound('clear');
                document.getElementById('final-time').textContent = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('result-modal').classList.remove('hidden');
            } else {
                nextStep();
            }
        } else {
            playSound('ng');
        }
    }

    startGame();
</script>
</body>
</html>
