<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ゴースト・アタック！四則けいさん - さんすうパーク</title>
    <link rel="stylesheet" href="css/game-common.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box;
            font-family: sans-serif; user-select: none; color: white;
        }
        .game-container {
            background-color: #0f172a; border-radius: 24px; border: 6px solid #818cf8;
            box-shadow: 0 10px 0 #4338ca, 0 15px 25px rgba(0,0,0,0.5);
            padding: 16px; width: 100%; max-width: 420px; text-align: center; box-sizing: border-box;
        }
        h1 { color: #818cf8; font-size: 20px; margin: 0 0 8px 0; }
        .info-bar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #1e293b; border: 2px solid #475569; border-radius: 12px;
            padding: 6px 12px; margin-bottom: 12px; font-weight: bold; font-size: 15px; color: #a5b4fc;
        }

        /* 👻 消える計算ステージ */
        .display-stage {
            height: 140px; background: #020617; border-radius: 18px;
            border: 3px dashed #818cf8; margin-bottom: 16px;
            display: flex; justify-content: center; align-items: center; gap: 12px;
            position: relative; overflow: hidden; font-size: 48px; font-weight: bold;
        }
        .num-box {
            color: #38bdf8; text-shadow: 0 0 15px #38bdf8;
            transition: opacity 0.3s ease-out, transform 0.3s ease-out, filter 0.3s ease-out;
            min-width: 50px; text-align: center;
        }
        .num-box.vanish {
            opacity: 0; transform: scale(1.4); filter: blur(10px);
        }
        .op-sign { color: #f43f5e; font-size: 44px; text-shadow: 0 0 10px #f43f5e; }

        /* 4択ボタン */
        .choices-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
        .choice-btn {
            background: #4338ca; color: white; border: none; border-bottom: 5px solid #312e81;
            border-radius: 14px; font-size: 26px; font-weight: bold; padding: 14px 0; cursor: pointer;
            touch-action: manipulation;
        }
        .choice-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px;
        }
        .modal {
            background: #1e293b; border-radius: 20px; padding: 20px; max-width: 360px; width: 100%;
            border: 5px solid #818cf8; text-align: center; color: white;
        }
        .level-btn {
            display: block; width: 100%; padding: 12px 0; font-size: 16px; font-weight: bold;
            color: white; border: none; border-radius: 14px; cursor: pointer; margin-bottom: 8px; box-sizing: border-box;
        }
        .btn-easy { background-color: #22c55e; border-bottom: 4px solid #15803d; }
        .btn-mid  { background-color: #3b82f6; border-bottom: 4px solid #1d4ed8; }
        .btn-hard { background-color: #f43f5e; border-bottom: 4px solid #be123c; }

        .back-btn {
            display: inline-block; width: 100%; padding: 10px 0; font-size: 14px; font-weight: bold;
            color: white; background-color: #475569; border: none; border-bottom: 4px solid #334155;
            border-radius: 12px; cursor: pointer; text-decoration: none; box-sizing: border-box; margin-top: 4px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <h1 id="title-display">👻 ゴースト・アタック！四則</h1>
    <div class="info-bar">
        <span>のこり: <span id="q-num" style="color:#f43f5e; font-size:18px;">10</span> 問</span>
        <span>タイム: <span id="timer" style="color:#38bdf8; font-size:18px;">0.0</span> 秒</span>
    </div>

    <div class="display-stage">
        <span class="num-box" id="num-a">?</span>
        <span class="op-sign" id="op-sign">＋</span>
        <span class="num-box" id="num-b">?</span>
    </div>

    <div class="choices-grid" id="choices"></div>

    <button class="back-btn" onclick="showSelectModal()">🔄 むずかしさを えらびなおす</button>
</div>

<!-- 難易度選択画面 -->
<div id="select-modal" class="overlay">
    <div class="modal">
        <h2 style="color:#818cf8; margin-top:0;">コースをえらぼう！</h2>
        <p style="font-size:13px; color:#cbd5e1; margin-bottom:14px;">1秒で消える数字を覚えて四則計算！</p>
        
        <button class="level-btn btn-easy" onclick="selectLevel('easy')">🟢 しょきゅう (＋ － のみ)</button>
        <button class="level-btn btn-mid"  onclick="selectLevel('mid')">🔵 ちゅうきゅう (＋ － ×)</button>
        <button class="level-btn btn-hard" onclick="selectLevel('hard')">🔴 じょうきゅう (＋ － × ÷ フル演出)</button>

        <a href="index.html" class="back-btn">🏠 メニューにもどる</a>
    </div>
</div>

<!-- クリア画面 -->
<div id="result-modal" class="overlay hidden">
    <div class="modal">
        <h2 style="color:#818cf8; margin-top:0; font-size:26px;">🎉 完全攻略！！</h2>
        <p style="font-size:18px;">タイム: <b id="final-time" style="color:#38bdf8;"></b> 秒</p>
        <button class="level-btn btn-mid" onclick="startGame()">もういちど あそぶ</button>
        <button class="level-btn btn-easy" onclick="showSelectModal()">ほかのコース</button>
        <a href="index.html" class="back-btn">メニューにもどる</a>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'ok') {
            osc.frequency.setValueAtTime(523, now); osc.frequency.exponentialRampToValueAtTime(1046, now + 0.15);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'ng') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'clear') {
            osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1);
            osc.frequency.setValueAtTime(783, now + 0.2); osc.frequency.setValueAtTime(1046, now + 0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        }
    }

    let currentLevel = 'easy';
    let remQuestions = 10, targetAns = 0;
    let startTime = 0, timerInterval = null, isAnswering = false;

    function showSelectModal() {
        clearInterval(timerInterval);
        document.getElementById('result-modal').classList.add('hidden');
        document.getElementById('select-modal').classList.remove('hidden');
    }

    function selectLevel(lvl) {
        currentLevel = lvl;
        document.getElementById('select-modal').classList.add('hidden');
        startGame();
    }

    function startGame() {
        document.getElementById('result-modal').classList.add('hidden');
        remQuestions = 10;
        document.getElementById('q-num').textContent = remQuestions;
        
        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            document.getElementById('timer').textContent = ((Date.now() - startTime) / 1000).toFixed(1);
        }, 100);

        nextQuestion();
    }

    function nextQuestion() {
        if (remQuestions <= 0) {
            clearInterval(timerInterval); playSound('clear');
            document.getElementById('final-time').textContent = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('result-modal').classList.remove('hidden');
            return;
        }

        // 演算子の決定
        let allowedOps = ['+'];
        if (currentLevel === 'easy') allowedOps = ['+', '-'];
        else if (currentLevel === 'mid') allowedOps = ['+', '-', '×'];
        else allowedOps = ['+', '-', '×', '÷'];

        const op = allowedOps[Math.floor(Math.random() * allowedOps.length)];
        let numA = 0, numB = 0;

        if (op === '+') {
            numA = Math.floor(Math.random() * 12) + 2;
            numB = Math.floor(Math.random() * 12) + 2;
            targetAns = numA + numB;
        } else if (op === '-') {
            numA = Math.floor(Math.random() * 15) + 5;
            numB = Math.floor(Math.random() * (numA - 1)) + 1; // 答えが正になるように
            targetAns = numA - numB;
        } else if (op === '×') {
            numA = Math.floor(Math.random() * 8) + 2;
            numB = Math.floor(Math.random() * 8) + 2;
            targetAns = numA * numB;
        } else if (op === '÷') {
            numB = Math.floor(Math.random() * 7) + 2;
            targetAns = Math.floor(Math.random() * 7) + 2;
            numA = numB * targetAns; // 割り切れる数を作成
        }

        const boxA = document.getElementById('num-a');
        const boxB = document.getElementById('num-b');
        const opSign = document.getElementById('op-sign');

        boxA.textContent = numA;
        boxB.textContent = numB;
        opSign.textContent = op;

        boxA.classList.remove('vanish');
        boxB.classList.remove('vanish');

        isAnswering = false;

        // 1秒後にオバケ化（消去）
        setTimeout(() => {
            boxA.classList.add('vanish');
            boxB.classList.add('vanish');
            isAnswering = true;
        }, 1000);

        // 選択肢作成
        const choices = [targetAns];
        while (choices.length < 4) {
            let dummy = targetAns + (Math.floor(Math.random() * 7) - 3);
            if (dummy >= 0 && !choices.includes(dummy)) choices.push(dummy);
        }
        choices.sort(() => Math.random() - 0.5);

        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';

        choices.forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn'; btn.textContent = val;
            btn.onclick = () => {
                if (!isAnswering) return;
                if (val === targetAns) {
                    playSound('ok');
                    remQuestions--;
                    document.getElementById('q-num').textContent = remQuestions;
                    nextQuestion();
                } else {
                    playSound('ng');
                }
            };
            choicesDiv.appendChild(btn);
        });
    }
</script>
</body>
</html>
