<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>解き方を叩き込む！わりざん筆算【全パターン網羅版】</title>
  <!-- 共通スタイルシート -->
  <link rel="stylesheet" href="css/game-common.css">
  <style>
    body {
      background: linear-gradient(135deg, #a8edf0 0%, #fed6e3 100%);
      display: flex; justify-content: center; align-items: center;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      width: 100%; max-width: 400px;
      padding: 14px; text-align: center;
      position: relative;
    }
    h1 { font-size: 17px; color: #334155; margin: 0 0 6px 0; }
    
    /* ステータスバー */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #f1f5f9; padding: 5px 12px; border-radius: 10px;
      margin-bottom: 6px; font-size: 12px; font-weight: bold; color: #475569;
    }
    .count-badge { color: #2563eb; font-size: 15px; }

    /* レベル切替ドロップダウン / ボタン群 */
    .mode-container {
      margin-bottom: 8px;
    }
    .mode-select-dropdown {
      width: 100%; padding: 8px; border-radius: 10px;
      border: 2px solid #3b82f6; background: #eff6ff;
      font-size: 13px; font-weight: bold; color: #1e3a8a;
      outline: none; cursor: pointer; text-align: center;
    }

    /* メッセージ領域 */
    .msg-area {
      min-height: 38px; font-size: 12px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      padding: 4px 8px; border-radius: 8px; margin-bottom: 8px;
      line-height: 1.3;
    }
    .msg-area.ok { color: #15803d; background: #f0fdf4; }
    .msg-area.error { color: #b91c1c; background: #fef2f2; border: 1px solid #fca5a5; }

    /* 筆算表示エリア */
    .hissan-area {
      background: #f8fafc; border: 2px dashed #94a3b8; border-radius: 16px;
      padding: 10px; margin-bottom: 8px;
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 210px;
    }
    .hissan-grid {
      display: grid;
      font-family: 'Courier New', Courier, monospace;
      font-size: 24px; font-weight: bold; color: #1e293b;
      line-height: 32px;
    }
    .cell {
      width: 28px; height: 32px;
      display: flex; justify-content: center; align-items: center;
      position: relative;
    }
    
    /* エラーハイライト */
    .cell.err-text { color: #dc2626; font-weight: 900; background: #fee2e2; border-radius: 4px; }
    .cell.rem-text { color: #d97706; font-weight: bold; } /* あまりの表示 */

    /* 筆算の線 */
    .border-roof { border-top: 3px solid #1e293b; }
    .border-wall { border-right: 3px solid #1e293b; border-top-right-radius: 6px; }
    .border-line { border-bottom: 2px solid #1e293b; }

    /* 入力マス */
    .input-box {
      width: 26px; height: 30px; border: 2px solid #3b82f6;
      border-radius: 6px; background: #fef08a; color: #1e293b;
      font-size: 20px; font-weight: bold; display: flex;
      justify-content: center; align-items: center;
      box-shadow: 0 0 8px rgba(234, 179, 8, 0.6);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }

    /* 整列されたテンキー */
    .keypad {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
      max-width: 280px; margin: 0 auto;
    }
    .key-zero { grid-column: span 2; }
    .key-clear { background: #fee2e2; color: #dc2626; box-shadow: 0 3px 0 #fca5a5; }
  </style>
</head>
<body>

<a href="index.html" class="back-to-menu">🏠 メニュー</a>
<div class="wrapper">
<div class="card">
  <h1>➗ ひっさん解き方マスター</h1>

  <!-- カウンターバー -->
  <div class="status-bar">
    <span>クリア数: <span id="solve-count" class="count-badge">0</span> 問</span>
    <span id="rem-badge" style="color: #d97706;">あまりなし</span>
  </div>

  <!-- 💡 小学生用 筆算4ステップナビゲーションバー -->
  <div id="hissan-step-bar" style="display: flex; justify-content: space-around; background: #eff6ff; border: 2px solid #bfdbfe; border-radius: 12px; padding: 6px 4px; margin-bottom: 8px; font-size: 11px; font-weight: bold; color: #64748b;">
    <span id="step-1" style="padding: 2px 6px; border-radius: 8px; background: #3b82f6; color: #fff;">1. たてる(÷)</span>
    <span id="step-2" style="padding: 2px 6px; border-radius: 8px;">2. かける(×)</span>
    <span id="step-3" style="padding: 2px 6px; border-radius: 8px;">3. ひく(－)</span>
    <span id="step-4" style="padding: 2px 6px; border-radius: 8px;">4. おろす(↓)</span>
  </div>

  <!-- 全7コース選択ドロップダウン -->
  <div class="mode-container">
    <select class="mode-select-dropdown" id="modeSelect" onchange="changeMode(this.value)">
      <option value="1">1. 2けた ÷ 1けた（あまりなし）</option>
      <option value="2">2. 2けた ÷ 1けた（あまりあり）</option>
      <option value="3">3. 2けた ÷ 2けた（あまりなし）</option>
      <option value="4">4. 2けた ÷ 2けた（あまりあり）</option>
      <option value="5">5. 3けた ÷ 1けた（あまりなし）</option>
      <option value="6">6. 3けた ÷ 1けた（あまりあり）</option>
      <option value="7">7. 3けた ÷ 2けた（あまりあり）</option>
    </select>
  </div>

  <!-- ガイドメッセージ -->
  <div id="msg" class="msg-area ok">黄色のマスに商（立てる数）を入れよう！</div>

  <!-- 筆算エリア -->
  <div class="hissan-area">
    <div id="grid" class="hissan-grid"></div>
  </div>

  <!-- キーパッド -->
  <div class="keypad">
    <button class="key" onclick="pressNum(7)">7</button>
    <button class="key" onclick="pressNum(8)">8</button>
    <button class="key" onclick="pressNum(9)">9</button>
    <button class="key" onclick="pressNum(4)">4</button>
    <button class="key" onclick="pressNum(5)">5</button>
    <button class="key" onclick="pressNum(6)">6</button>
    <button class="key" onclick="pressNum(1)">1</button>
    <button class="key" onclick="pressNum(2)">2</button>
    <button class="key" onclick="pressNum(3)">3</button>
    <button class="key key-zero" onclick="pressNum(0)">0</button>
  </div>
</div>
</div>

<script src="js/game-common.js"></script>
<script>
  let mode = 1;
  let divisor = 0, dividend = 0, remainder = 0;
  let qDigits = [];
  let currentStep = 0;
  let userAnswers = [];
  let solvedCount = 0;
  
  let tempWrongVal = null; 
  let wrongReason = "";

  // ⌨️ 物理キーボード連携
  KeyboardHelper.bindNumPad(
    (numKey) => pressNum(parseInt(numKey)),
    null,
    () => pressClear()
  );

  function changeMode(m) {
    mode = parseInt(m, 10);
    initProblem();
  }

  function initProblem() {
    tempWrongVal = null;
    wrongReason = "";

    // 7パターンの算数出題ロジック
    switch(mode) {
      case 1: // 2桁÷1桁（余りなし）
        divisor = rand(2, 9);
        dividend = divisor * rand(11, 49);
        remainder = 0;
        break;
      case 2: // 2桁÷1桁（余りあり）
        divisor = rand(3, 9);
        remainder = rand(1, divisor - 1);
        dividend = (divisor * rand(11, 30)) + remainder;
        break;
      case 3: // 2桁÷2桁（余りなし）
        divisor = rand(11, 25);
        dividend = divisor * rand(3, 9);
        remainder = 0;
        break;
      case 4: // 2桁÷2桁（余りあり）
        divisor = rand(12, 25);
        remainder = rand(1, divisor - 1);
        dividend = (divisor * rand(2, 7)) + remainder;
        if (dividend >= 100) dividend = 99; // 2桁に抑える
        remainder = dividend % divisor;
        break;
      case 5: // 3桁÷1桁（余りなし）
        divisor = rand(3, 9);
        dividend = divisor * rand(102, 245);
        remainder = 0;
        break;
      case 6: // 3桁÷1桁（余りあり）
        divisor = rand(3, 9);
        remainder = rand(1, divisor - 1);
        dividend = (divisor * rand(102, 210)) + remainder;
        break;
      case 7: // 3桁÷2桁（余りあり）
        divisor = rand(12, 35);
        remainder = rand(1, divisor - 1);
        dividend = (divisor * rand(12, 28)) + remainder;
        break;
    }
    
    let qStr = Math.floor(dividend / divisor).toString();
    qDigits = qStr.split('').map(Number);
    userAnswers = new Array(qDigits.length).fill(null);
    currentStep = 0;

    document.getElementById('rem-badge').innerText = remainder > 0 ? "あまりあり" : "あまりなし";
    setMessage("黄色のマスに数字を入れてね！", "ok");
    render();
  }

  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function setMessage(txt, type) {
    const el = document.getElementById('msg');
    el.innerText = txt;
    el.className = `msg-area ${type}`;
  }

  function render() {
    // 💡 ステップインジケーターのハイライト
    for (let s = 1; s <= 4; s++) {
      const el = document.getElementById(`step-${s}`);
      if (el) {
        el.style.background = (s === 1) ? '#3b82f6' : 'transparent';
        el.style.color = (s === 1) ? '#fff' : '#64748b';
      }
    }

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    const divStr = dividend.toString();
    const dorStr = divisor.toString();
    const cols = dorStr.length + divStr.length;
    grid.style.gridTemplateColumns = `repeat(${cols}, 28px)`;

    // 1行目：商の表示／入力
    for (let i = 0; i < dorStr.length; i++) grid.appendChild(createCell(''));
    for (let i = 0; i < divStr.length; i++) {
      let cell = createCell('');
      let stepIdx = i - (divStr.length - qDigits.length);
      if (stepIdx >= 0) {
        if (userAnswers[stepIdx] !== null) {
          cell.innerText = userAnswers[stepIdx];
        } else if (stepIdx === currentStep) {
          if (tempWrongVal !== null) {
            cell.innerText = tempWrongVal;
            cell.classList.add('err-text');
          } else {
            cell.appendChild(createInputBox());
          }
        }
      }
      grid.appendChild(cell);
    }

    // 2行目：割る数 ＋ 割られる数
    for (let i = 0; i < dorStr.length; i++) {
      let c = createCell(dorStr[i]);
      if (i === dorStr.length - 1) c.classList.add('border-wall');
      grid.appendChild(c);
    }
    for (let i = 0; i < divStr.length; i++) {
      let c = createCell(divStr[i]);
      c.classList.add('border-roof');
      grid.appendChild(c);
    }

    // 正解ステップの描画
    let currentDividendPart = 0;
    for (let s = 0; s < currentStep; s++) {
      let ans = userAnswers[s];
      let multResult = ans * divisor;
      let digitPos = dorStr.length + (divStr.length - qDigits.length) + s;

      appendRow(grid, cols, digitPos, multResult.toString(), true, false);

      let rem;
      if (s === 0) {
        let firstTake = parseInt(divStr.substring(0, divStr.length - qDigits.length + 1));
        rem = firstTake - multResult;
      } else {
        rem = (currentDividendPart - multResult);
      }
      
      let nextDigit = divStr[s + (divStr.length - qDigits.length + 1)];
      let subResultStr = rem === 0 ? "" : rem.toString();
      if (nextDigit !== undefined) subResultStr += nextDigit;
      if (subResultStr === "") subResultStr = "0";

      currentDividendPart = parseInt(subResultStr) || 0;

      if (s < qDigits.length - 1) {
        appendRow(grid, cols, digitPos + (nextDigit !== undefined ? 1 : 0), subResultStr, false, false);
      } else {
        // 最後のあまり（0または計算されたあまり）
        let finalRemStr = (dividend % divisor).toString();
        appendRow(grid, cols, digitPos, finalRemStr, false, false);
      }
    }

    // 間違った入力時のシミュレーション描画
    if (tempWrongVal !== null) {
      let ans = tempWrongVal;
      let multResult = ans * divisor;
      let digitPos = dorStr.length + (divStr.length - qDigits.length) + currentStep;

      appendRow(grid, cols, digitPos, multResult.toString(), true, wrongReason === 'too_big');

      let targetVal;
      if (currentStep === 0) {
        targetVal = parseInt(divStr.substring(0, divStr.length - qDigits.length + 1));
      } else {
        targetVal = currentDividendPart;
      }

      let rem = targetVal - multResult;
      if (wrongReason === 'too_small') {
        let nextDigit = divStr[currentStep + (divStr.length - qDigits.length + 1)];
        let subStr = rem.toString();
        if (nextDigit !== undefined) subStr += nextDigit;
        appendRow(grid, cols, digitPos + (nextDigit !== undefined ? 1 : 0), subStr, false, true);
      }
    }
  }

  function appendRow(grid, totalCols, rightColIdx, strValue, isLine, isError) {
    let startCol = rightColIdx - strValue.length + 1;
    for (let c = 0; c < totalCols; c++) {
      let cell = createCell('');
      if (c >= startCol && c <= rightColIdx) {
        let charIdx = c - startCol;
        cell.innerText = strValue[charIdx];
        if (isLine) cell.classList.add('border-line');
        if (isError) cell.classList.add('err-text');
      }
      grid.appendChild(cell);
    }
  }

  function createCell(txt) {
    const div = document.createElement('div');
    div.className = 'cell';
    div.innerText = txt;
    return div;
  }

  function createInputBox() {
    const div = document.createElement('div');
    div.className = 'input-box';
    div.innerText = '?';
    return div;
  }

  function pressNum(val) {
    let correctVal = qDigits[currentStep];

    if (val === correctVal) {
      sounds.playCorrect(currentStep + 1);
      tempWrongVal = null;
      wrongReason = "";
      userAnswers[currentStep] = val;
      currentStep++;
      
      if (currentStep >= qDigits.length) {
        solvedCount++;
        document.getElementById('solve-count').innerText = solvedCount;
        let finalRem = dividend % divisor;
        let msgStr = finalRem > 0 ? `🎉 正解！あまりは【${finalRem}】` : "🎉 すごい！ 割り切れた！";
        setMessage(msgStr, "ok");
        FXHelper.createConfetti(20);
        sounds.playFanfare();
        ScoreStore.saveGameData('warizanz', { score: solvedCount * 100, stars: Math.min(3, Math.floor(solvedCount / 3) + 1) });
        render();

        setTimeout(() => {
          initProblem();
        }, 1400);
      } else {
        setMessage("✨ 正解！ 次の桁の商を立てよう", "ok");
        render();
      }
    } else {
      sounds.playIncorrect();
      tempWrongVal = val;
      if (val > correctVal) {
        wrongReason = 'too_big';
        setMessage(`❌ 「${val}」だと引けないよ！\n（${divisor}×${val}=${divisor*val} は上より大きい）`, "error");
      } else {
        wrongReason = 'too_small';
        setMessage(`❌ 「${val}」だと小さすぎるよ！\n（あまりの数字が割る数「${divisor}」より大きい）`, "error");
      }
      render();
    }
  }

  function pressClear() {
    sounds.playClick();
    tempWrongVal = null;
    wrongReason = "";
    setMessage("黄色のマスに数字を入れてね！", "ok");
    render();
  }

  initProblem();
</script>

</body>
</html>
