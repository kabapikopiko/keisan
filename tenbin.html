<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>てんびんパズル - さんすうパーク</title>
    <link rel="stylesheet" href="css/game-common.css">
    <style>
        body {
            background: linear-gradient(135deg, #fef2f2 0%, #ffe4e6 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box;
            font-family: sans-serif; user-select: none;
        }
        .game-container {
            background-color: white; border-radius: 24px; border: 6px solid #e11d48;
            box-shadow: 0 10px 0 #be123c, 0 15px 25px rgba(0,0,0,0.15);
            padding: 16px; width: 100%; max-width: 420px; text-align: center; box-sizing: border-box;
        }
        h1 { color: #be123c; font-size: 22px; margin: 0 0 8px 0; }
        .info-bar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #fff1f2; border: 3px solid #fecdd3; border-radius: 14px;
            padding: 8px 14px; margin-bottom: 12px; font-weight: bold; font-size: 16px; color: #be123c;
        }
        /* 天秤エリア */
        .scale-area {
            position: relative; background: #fff8f8; border: 3px solid #fda4af;
            border-radius: 18px; padding: 20px 10px 10px; margin-bottom: 16px; min-height: 140px;
        }
        .scale-beam {
            width: 80%; height: 8px; background: #9f1239; margin: 20px auto 0;
            position: relative; border-radius: 4px;
        }
        .scale-base {
            width: 0; height: 0; border-left: 20px solid transparent;
            border-right: 20px solid transparent; border-bottom: 40px solid #be123c;
            margin: 0 auto;
        }
        .pan {
            position: absolute; top: 0; width: 90px; min-height: 60px; background: #ffe4e6;
            border: 3px solid #f43f5e; border-radius: 12px; display: flex;
            flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; padding: 4px;
        }
        .pan-left { left: -10px; transform: translateY(-50%); }
        .pan-right { right: -10px; transform: translateY(-50%); }
        .weight {
            background: #e11d48; color: white; font-weight: bold; font-size: 18px;
            padding: 6px 10px; border-radius: 8px; border-bottom: 3px solid #9f1239;
        }
        .weight.hole {
            background: #fef08a; color: #ca8a04; border: 3px dashed #eab308; border-bottom-width: 3px;
        }
        /* 選択肢 */
        .choices-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
        .choice-btn {
            background: #f43f5e; color: white; border: none; border-bottom: 5px solid #be123c;
            border-radius: 14px; font-size: 24px; font-weight: bold; padding: 12px 0; cursor: pointer;
        }
        .choice-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px;
        }
        .modal {
            background: white; border-radius: 20px; padding: 20px; max-width: 360px; width: 100%;
            border: 5px solid #e11d48; text-align: center;
        }
        .start-btn, .back-btn {
            display: inline-block; width: 100%; padding: 12px 0; font-size: 16px; font-weight: bold;
            color: white; background-color: #e11d48; border: none; border-bottom: 5px solid #be123c;
            border-radius: 14px; cursor: pointer; text-decoration: none; margin-top: 8px; box-sizing: border-box;
        }
        .back-btn { background-color: #64748b; border-bottom-color: #475569; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>⚖️ てんびんパズル</h1>
    <div class="info-bar">
        <span>もんだい: <span id="q-num">1</span> / 10</span>
        <span>タイム: <span id="timer">0.0</span> 秒</span>
    </div>

    <div class="scale-area">
        <div class="scale-beam">
            <div class="pan pan-left" id="pan-l"></div>
            <div class="pan pan-right" id="pan-r"></div>
        </div>
        <div class="scale-base"></div>
    </div>

    <div class="choices-grid" id="choices"></div>
    <a href="index.html" class="back-btn" style="padding:8px 0; font-size:14px;">🏠 メニューにもどる</a>
</div>

<div id="result-modal" class="overlay hidden">
    <div class="modal">
        <h2 style="color:#e11d48; margin-top:0;">🎉 つりあいマスター！</h2>
        <p style="font-size:18px;">タイム: <b id="final-time" style="color:#e11d48;"></b> 秒</p>
        <button class="start-btn" onclick="startGame()">もういちど あそぶ</button>
        <a href="index.html" class="back-btn">メニューにもどる</a>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'ok') {
            osc.frequency.setValueAtTime(523, now); osc.frequency.exponentialRampToValueAtTime(1046, now + 0.15);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'ng') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'clear') {
            osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1);
            osc.frequency.setValueAtTime(783, now + 0.2); osc.frequency.setValueAtTime(1046, now + 0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        }
    }

    let qCount = 0, targetAns = 0, startTime = 0, timerInterval = null;

    function startGame() {
        qCount = 0; startTime = Date.now();
        document.getElementById('result-modal').classList.add('hidden');
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            document.getElementById('timer').textContent = ((Date.now() - startTime) / 1000).toFixed(1);
        }, 100);
        nextQuestion();
    }

    function nextQuestion() {
        qCount++;
        if (qCount > 10) {
            clearInterval(timerInterval); playSound('clear');
            document.getElementById('final-time').textContent = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('result-modal').classList.remove('hidden');
            return;
        }
        document.getElementById('q-num').textContent = qCount;

        const leftCount = Math.floor(Math.random() * 2) + 1; // 1~2個
        let leftSum = 0; const leftWeights = [];
        for (let i = 0; i < leftCount; i++) {
            const val = Math.floor(Math.random() * 8) + 2;
            leftWeights.push(val); leftSum += val;
        }

        const knownRight = Math.floor(Math.random() * (leftSum - 1)) + 1;
        targetAns = leftSum - knownRight;

        const panL = document.getElementById('pan-l'); panL.innerHTML = '';
        leftWeights.forEach(w => panL.innerHTML += `<div class="weight">${w}</div>`);

        const panR = document.getElementById('pan-r');
        panR.innerHTML = `<div class="weight">${knownRight}</div><div class="weight hole">？</div>`;

        const choices = [targetAns];
        while (choices.length < 4) {
            let dummy = targetAns + Math.floor(Math.random() * 7) - 3;
            if (dummy > 0 && !choices.includes(dummy)) choices.push(dummy);
        }
        choices.sort(() => Math.random() - 0.5);

        const choicesDiv = document.getElementById('choices'); choicesDiv.innerHTML = '';
        choices.forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn'; btn.textContent = val;
            btn.onclick = () => {
                if (val === targetAns) {
                    playSound('ok'); nextQuestion();
                } else {
                    playSound('ng');
                }
            };
            choicesDiv.appendChild(btn);
        });
    }

    startGame();
</script>
</body>
</html>
