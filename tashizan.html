<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>たしざん タイムアタック</title>
    <!-- 共通スタイルシート -->
    <link rel="stylesheet" href="css/game-common.css">
    <style>
        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .back-to-menu {
            color: #e67e22;
            border-color: #ffbe76;
            box-shadow: 0 4px 0 #f0932b;
        }

        #game-container {
            border: 6px solid #ffbe76; 
            box-shadow: 0 10px 0 #f0932b, 0 15px 30px rgba(0,0,0,0.15);
            width: 100%; max-width: 340px;
            height: 92vh; max-height: 580px; 
        }

        /* レベル選択画面 */
        #level-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; gap: 15px;
        }
        #level-screen h2 {
            margin: 0 0 10px 0; color: #d35400; font-size: 24px;
        }

        .game-header h2 {
            margin: 0 0 5px 0; color: #d35400; font-size: 18px; text-shadow: 1px 1px 0 white;
        }

        .dot.current { border: 2px solid #ff9f43; background-color: #fff; color: #ff9f43; transform: scale(1.05); }

        .question-zone {
            background-color: #f7f9fa; border: 4px dashed #c5eff7; border-radius: 20px;
            margin: 10px 0; flex-grow: 1; display: flex; justify-content: center; align-items: center; min-height: 80px;
        }

        #question-row { display: flex; justify-content: center; align-items: center; gap: 12px; }
        #question { font-size: 44px; font-weight: bold; color: #2c3e50; text-shadow: 1px 1px 0px #fff; }

        #answer-display {
            font-size: 44px; font-weight: bold; width: 90px; height: 60px; line-height: 55px;
            border-bottom: 5px solid #ff9f43; color: #ff9f43; text-align: center; background-color: #fff; border-radius: 8px 8px 0 0;
        }

        .time-text {
            font-size: 42px; color: #e67e22; font-weight: bold; margin-bottom: 15px; text-shadow: 1px 1px 0 white;
        }
    </style>
</head>
<body>

<a href="index.html" id="back-btn" class="back-to-menu" onclick="playSound('click')">🏠 メニュー</a>

<div class="wrapper">
    <div id="game-container">
        <div id="flash-overlay">
            <div id="flash-mark">💮</div>
            <div id="flash-text">せいかい！</div>
        </div>

        <div id="level-screen">
            <h2>どのレベルにする？</h2>
            <button class="btn-level btn-easy" onclick="selectLevel('easy')">🟢 しょきゅう</button>
            <button class="btn-level btn-medium" onclick="selectLevel('medium')">🟡 ちゅうきゅう</button>
            <button class="btn-level btn-hard" onclick="selectLevel('hard')">🔴 じょうきゅう</button>
        </div>

        <div id="play-screen" style="height: 100%; display: none; flex-direction: column; justify-content: space-between;">
            <div class="game-header">
                <h2>⏱️ たしざん [<span id="mode-title"></span>]</h2>
                <div id="history-board">
                    <div class="dot" id="dot-0">1</div>
                    <div class="dot" id="dot-1">2</div>
                    <div class="dot" id="dot-2">3</div>
                    <div class="dot" id="dot-3">4</div>
                    <div class="dot" id="dot-4">5</div>
                    <div class="dot" id="dot-5">6</div>
                    <div class="dot" id="dot-6">7</div>
                    <div class="dot" id="dot-7">8</div>
                    <div class="dot" id="dot-8">9</div>
                    <div class="dot" id="dot-9">10</div>
                </div>
            </div>
            
            <div class="question-zone">
                <div id="question-row">
                    <div id="question">? + ? =</div>
                    <div id="answer-display"></div>
                </div>
            </div>

            <div class="keyboard">
                <button class="key key-num" onclick="pressKey('1')">1</button>
                <button class="key key-num" onclick="pressKey('2')">2</button>
                <button class="key key-num" onclick="pressKey('3')">3</button>
                <button class="key key-num" onclick="pressKey('4')">4</button>
                <button class="key key-num" onclick="pressKey('5')">5</button>
                <button class="key key-num" onclick="pressKey('6')">6</button>
                <button class="key key-num" onclick="pressKey('7')">7</button>
                <button class="key key-num" onclick="pressKey('8')">8</button>
                <button class="key key-num" onclick="pressKey('9')">9</button>
                <button class="key key-num" onclick="pressKey('0')">0</button>
                <button class="key key-clear" onclick="pressKey('clear')">けす</button>
                <button class="key key-enter" onclick="pressKey('enter')">こたえる</button>
            </div>
        </div>

        <div id="result-screen">
            <h2>🎉 チャレンジ終了！</h2>
            <div id="star-rating" class="star-rating">⭐⭐⭐</div>
            <div class="time-label">かかった時間</div>
            <div class="time-text" id="final-time">00秒00</div>
            <p id="final-score" style="font-size: 16px; font-weight: bold; color: #57606f; margin-bottom: 15px;"></p>
            <p id="best-record-msg" style="font-size: 14px; font-weight: bold; color: #e67e22; margin-bottom: 15px;"></p>
            <button class="btn-restart" onclick="showLevelSelect()">もういちどチャレンジ</button>
        </div>
    </div>
</div>

<script src="js/game-common.js"></script>
<script>
    let num1 = 0, num2 = 0, correctAnswer = 0;
    let currentQuestionIndex = 0;
    let correctCount = 0;
    let comboCount = 0;
    let currentInput = "";
    let startTime = 0;
    let lockInput = false;
    let currentLevel = "medium";

    const totalQuestions = 10;

    const backBtn = document.getElementById('back-btn');
    const levelScreen = document.getElementById('level-screen');
    const playScreen = document.getElementById('play-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionEl = document.getElementById('question');
    const answerDisplayEl = document.getElementById('answer-display');
    const flashOverlay = document.getElementById('flash-overlay');
    const flashMark = document.getElementById('flash-mark');
    const flashText = document.getElementById('flash-text');
    const finalTimeEl = document.getElementById('final-time');
    const finalScoreEl = document.getElementById('final-score');
    const modeTitleEl = document.getElementById('mode-title');
    const starRatingEl = document.getElementById('star-rating');
    const bestRecordMsgEl = document.getElementById('best-record-msg');

    // ⌨️ 物理キーボード対応ヘルパーの登録
    KeyboardHelper.bindNumPad(
        (numKey) => pressKey(numKey),
        () => pressKey('enter'),
        () => pressKey('clear')
    );

    function playSound(type) {
        if (type === 'click') sounds.playClick();
        else if (type === 'correct') sounds.playCorrect(comboCount);
        else if (type === 'incorrect') sounds.playIncorrect();
    }

    function createParticles() {
        FXHelper.createConfetti(25);
    }

    function showLevelSelect() {
        resultScreen.style.display = 'none';
        levelScreen.style.display = 'flex';
        backBtn.classList.remove('hidden');
    }

    function selectLevel(level) {
        sounds.playClick();
        currentLevel = level;
        
        if (level === 'easy') modeTitleEl.innerText = "しょきゅう";
        if (level === 'medium') modeTitleEl.innerText = "ちゅうきゅう";
        if (level === 'hard') modeTitleEl.innerText = "じょうきゅう";

        initGame();
    }

    function initGame() {
        currentQuestionIndex = 0;
        correctCount = 0;
        comboCount = 0;
        currentInput = "";
        lockInput = false;

        for (let i = 0; i < totalQuestions; i++) {
            const dot = document.getElementById(`dot-${i}`);
            dot.className = "dot";
            dot.innerText = i + 1;
        }

        levelScreen.style.display = 'none';
        playScreen.style.display = 'flex';
        resultScreen.style.display = 'none';
        flashOverlay.classList.remove('active');

        backBtn.classList.add('hidden');

        startTime = performance.now();
        makeQuestion();
    }

    function makeQuestion() {
        if (currentLevel === 'easy') {
            num1 = Math.floor(Math.random() * 5) + 1;
            num2 = Math.floor(Math.random() * 5) + 1;
        } else if (currentLevel === 'hard') {
            num1 = Math.floor(Math.random() * 9) + 11;
            num2 = Math.floor(Math.random() * 9) + 1;
        } else {
            num1 = Math.floor(Math.random() * 9) + 1;
            num2 = Math.floor(Math.random() * 9) + 1;
        }

        correctAnswer = num1 + num2;

        questionEl.innerText = `${num1} ＋ ${num2} ＝`;
        currentInput = "";
        answerDisplayEl.innerText = "";

        document.getElementById(`dot-${currentQuestionIndex}`).classList.add('current');
    }

    function pressKey(key) {
        if (lockInput) return;

        sounds.playClick();

        if (key === 'clear') {
            currentInput = "";
        } else if (key === 'enter') {
            checkAnswer();
            return;
        } else {
            if (currentInput.length < 2) {
                currentInput += key;
            }
        }
        answerDisplayEl.innerText = currentInput;
    }

    function checkAnswer() {
        const userAnswer = parseInt(currentInput);
        if (isNaN(userAnswer)) return;

        lockInput = true;
        const currentDot = document.getElementById(`dot-${currentQuestionIndex}`);
        currentDot.classList.remove('current');

        let isCorrect = (userAnswer === correctAnswer);

        if (isCorrect) {
            comboCount++;
            sounds.playCorrect(comboCount);
            createParticles();
            currentDot.className = "dot o";
            currentDot.innerText = "◯";
            
            if (comboCount >= 3) {
                FXHelper.showComboText(`🔥 ${comboCount}れんぞく！`);
            }

            flashMark.innerText = "💮";
            flashText.innerText = comboCount >= 3 ? `すごーい！ ${comboCount}連続せいかい！` : "せいかい！";
            flashText.style.color = "#2ed573";
            correctCount++;
        } else {
            comboCount = 0;
            sounds.playIncorrect();
            currentDot.className = "dot x";
            currentDot.innerText = "×";
            
            flashMark.innerText = "❌";
            flashText.innerText = `おしい！ こたえは 【${correctAnswer}】`;
            flashText.style.color = "#ff4757";
        }

        flashOverlay.classList.add('active');

        setTimeout(() => {
            flashOverlay.classList.remove('active');
            currentQuestionIndex++;

            if (currentQuestionIndex < totalQuestions) {
                lockInput = false;
                makeQuestion();
            } else {
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        const endTime = performance.now();
        const totalTimeNum = parseFloat(((endTime - startTime) / 1000).toFixed(2));
        const totalTimeStr = `${totalTimeNum.toFixed(2)} 秒`;

        playScreen.style.display = 'none';
        resultScreen.style.display = 'flex';

        // 星評価判定 (正解数とタイムによる判定)
        let stars = 1;
        if (correctCount >= 8 && totalTimeNum < 30) stars = 3;
        else if (correctCount >= 6) stars = 2;

        const starStr = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
        starRatingEl.innerText = starStr;

        finalTimeEl.innerText = totalTimeStr;
        finalScoreEl.innerText = `${totalQuestions}問中 ${correctCount}問 正解！`;

        // ベスト記録の保存
        const calculatedScore = (correctCount * 100) + Math.max(0, Math.floor((60 - totalTimeNum) * 10));
        const res = ScoreStore.saveGameData('tashizan', { score: calculatedScore, time: totalTimeNum, stars });

        if (res.isNewBestTime || res.isNewHigh) {
            bestRecordMsgEl.innerHTML = `🏆 自己ベスト更新！ <span class="badge-new">NEW</span>`;
            sounds.playFanfare();
        } else {
            const best = ScoreStore.getGameData('tashizan');
            bestRecordMsgEl.innerText = best.bestTime ? `(自己ベスト: ${best.bestTime}秒)` : '';
        }
    }
</script>

</body>
</html>
